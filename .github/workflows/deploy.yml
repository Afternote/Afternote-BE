name: Deploy to EC2 with Docker

on:
  push:
    branches: ["release"]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build --platform linux/amd64 -t ${{ secrets.DOCKER_USERNAME }}/afternote-server:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/afternote-server:latest

      # EC2가 Amazon Linux 2023 등이어도 Docker 서비스가 꺼져 있을 수 있어 한 줄 보강
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            sudo systemctl start docker 2>/dev/null || true
            cd ~/deploy

            if [ ! -f docker-compose.yml ]; then
              echo "[ERROR] docker-compose.yml not found in ~/deploy"
              exit 1
            fi

            if [ ! -f nginx/nginx.conf ]; then
              echo "[ERROR] nginx/nginx.conf not found in ~/deploy/nginx"
              exit 1
            fi

            if [ ! -d data/certbot/conf ]; then
              echo "[ERROR] data/certbot/conf directory not found"
              exit 1
            fi

            if [ ! -d data/certbot/www ]; then
              echo "[ERROR] data/certbot/www directory not found"
              exit 1
            fi

            sudo docker compose pull
            sudo docker compose up -d --remove-orphans --pull always
            sudo docker compose logs --tail=30 afternote-server
            sudo docker image prune -f
