version: 2

# 버전 업데이트 PR 일시 중지 (CI 분·메이저 범프 비용).
# 다시 켜려면 아래 open-pull-requests-limit 를 5 로 되돌린다.
# 보안 알림(Dependabot alerts)과는 별개다.

updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 0
    labels: [enhancement]
    groups:
      gradle-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "09:10"
      timezone: Asia/Seoul
    open-pull-requests-limit: 0
    labels: [enhancement]
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: Asia/Seoul
    open-pull-requests-limit: 0
    labels: [enhancement]
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
