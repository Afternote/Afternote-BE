spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # db.t4g.small(2GB) max_connections ≈ 150~170. 단일 앱 + 여유분 → 80.
    # (CloudWatch connections 알람이 40이면 같이 올리세요.)
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:80}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        show_sql: false
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

logging:
  level:
    com.example.afternote: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

# Error monitoring only (no tracing/replay). Set SENTRY_DSN in deploy env.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:prod}
  send-default-pii: false
  traces-sample-rate: 0.0
  exception-resolver-order: 2147483647
