name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

#github actions가 레포 내용을 읽을 수 있는 권한 설정
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency_submission:
    name: dependency-submission
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          cache-provider: basic

  dependency_review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    needs: dependency_submission
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600

  gradle_test:
    name: gradle-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-test-report
          path: build/reports/tests/test/

  docker_image:
    name: docker-image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Build current Docker image
        run: docker build -t afternote-server:ci .

  build:
    name: build
    if: ${{ always() }}
    needs:
      - dependency_review
      - gradle_test
      - docker_image
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Summarize required job results
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency_review.result }}
          GRADLE_TEST_RESULT: ${{ needs.gradle_test.result }}
          DOCKER_IMAGE_RESULT: ${{ needs.docker_image.result }}
        run: |
          failed=0

          require_success() {
            local job_name="$1"
            local result="$2"

            printf '%s: %s\n' "$job_name" "$result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            require_success "dependency-review" "$DEPENDENCY_REVIEW_RESULT"
          else
            printf 'dependency-review: %s (not required for %s)\n' \
              "$DEPENDENCY_REVIEW_RESULT" "$EVENT_NAME"
          fi

          require_success "gradle-test" "$GRADLE_TEST_RESULT"
          require_success "docker-image" "$DOCKER_IMAGE_RESULT"

          exit "$failed"
