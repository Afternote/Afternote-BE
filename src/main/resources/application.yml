spring:
  application:
    name: AfterNote-Server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    properties:
      hibernate:
        # MySQL native ENUM/CHECK 는 ddl-auto=update 가 값을 추가하지 않는다.
        # Java enum 상수 추가(BUSINESS, ESTATE 등)가 ALTER 없이 동작하도록 VARCHAR 로 고정한다.
        type:
          preferred_enum_jdbc_type: VARCHAR
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-flash-latest
            temperature: 0.7

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION}
  # 동일 refresh 동시·직후 reissue가 같은 새 토큰 쌍을 받게 하는 grace (초)
  reissue-grace-seconds: ${JWT_REISSUE_GRACE_SECONDS:30}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION}

# ChaCha20-Poly1305 암호화 설정 (SOCIAL credentials 보호)
# 모바일 환경에 최적화된 암호화 (ARM 프로세서에서 AES보다 빠름)
security:
  chacha20:
    secret-key: ${CHACHA20_SECRET_KEY} # 32 bytes for ChaCha20

# CORS 설정 (환경별로 다르게 설정)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# 소셜 로그인 API 설정
kakao:
  api:
    user-info-url: https://kapi.kakao.com/v2/user/me

google:
  oauth2:
    # 클라이언트가 보내는 ID Token의 aud 값과 일치해야 함 (Web Client ID)
    # Android/iOS 네이티브 앱이 serverClientId로 지정하는 값
    web-client-id: ${GOOGLE_WEB_CLIENT_ID}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

logging:
  level:
    com.example.afternote: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO

# Admin 계정 (서버 기동 시 1회). 운영/로컬 모두 환경 변수로만 설정합니다.
# ADMIN_EMAIL, ADMIN_PASSWORD — 둘 다 있을 때만 LOCAL Admin 계정 생성 또는 기존 유저를 ADMIN으로 승격
app:
  auth-code:
    email:
      enabled: true
  version:
    seed:
      android:
        version-code: ${APP_ANDROID_SEED_VERSION_CODE:10001}
        version-name: ${APP_ANDROID_SEED_VERSION_NAME:1.0.0}
        store-url: ${APP_ANDROID_STORE_URL:}

# 마인드레코드 감정 분석 (Gemini 실패 방어)
afternote:
  emotion-analysis:
    max-retry: 5
    backfill-batch-size: 20
    backfill-delay-ms: 300000

# FCM — google-services.json 의 project_id / package 와 동일해야 함
firebase:
  project-id: ${FIREBASE_PROJECT_ID:afternote-7471f}
  android-package-name: ${FIREBASE_ANDROID_PACKAGE_NAME:com.afternote.app}
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION:ap-northeast-2}
      # 업로드 크기 상한(바이트). 정책 미확정이므로 임시값 — 확정 시 여기만 조정.
      upload:
        max-bytes:
          image: ${S3_UPLOAD_MAX_BYTES_IMAGE:10485760}       # 10MB (jpg/jpeg/png/gif/webp/heic)
          video: ${S3_UPLOAD_MAX_BYTES_VIDEO:209715200}      # 200MB (mp4/mov)
          audio: ${S3_UPLOAD_MAX_BYTES_AUDIO:52428800}       # 50MB (mp3/m4a/wav)
          document: ${S3_UPLOAD_MAX_BYTES_DOCUMENT:20971520} # 20MB (pdf)
    public-base-url: ${AWS_PUBLIC_BASE_URL:}
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}

# Health only (db + redis). Other actuator endpoints stay closed.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
    redis:
      enabled: true
