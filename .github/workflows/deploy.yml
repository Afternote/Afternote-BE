name: Deploy to EC2 with Docker

# Jobs are split so "Re-run failed jobs" resumes from the failed stage
# (build → deploy → smoke → contract) instead of the whole pipeline.

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Skip Gradle/Docker build (reuse DockerHub :latest)"
        type: boolean
        default: false
      skip_deploy:
        description: "Skip EC2 deploy (smoke/contract against current host only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_build == false }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build --platform linux/amd64 -t ${{ secrets.DOCKER_USERNAME }}/afternote-server:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/afternote-server:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: >-
      always()
      && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
      && (github.event_name != 'workflow_dispatch' || inputs.skip_deploy == false)
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Materialize deploy/production.env from secret
        env:
          DEPLOY_PRODUCTION_ENV: ${{ secrets.DEPLOY_PRODUCTION_ENV }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_PRODUCTION_ENV:-}" ]; then
            echo "[WARN] DEPLOY_PRODUCTION_ENV secret empty — keep existing EC2 ~/deploy/.env"
            rm -f deploy/production.env
          else
            printf '%s\n' "$DEPLOY_PRODUCTION_ENV" > deploy/production.env
            echo "[INFO] wrote deploy/production.env from secret ($(wc -l < deploy/production.env) lines)"
          fi

      - name: Sync deploy configs to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "deploy/nginx/nginx.conf,deploy/docker-compose.yml,deploy/scripts/bootstrap-certs.sh"
          target: "/tmp/afternote-deploy-sync/"
          overwrite: true
          strip_components: 1

      - name: Sync production.env to EC2
        if: hashFiles('deploy/production.env') != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "deploy/production.env"
          target: "/tmp/afternote-deploy-sync/"
          overwrite: true
          strip_components: 1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          envs: CERTBOT_EMAIL
          script: |
            set -euo pipefail
            sudo systemctl start docker 2>/dev/null || true

            # AL2023 greenfield image may have docker without compose plugin
            if ! docker compose version >/dev/null 2>&1; then
              echo "[INFO] installing docker compose plugin..."
              sudo mkdir -p /usr/libexec/docker/cli-plugins
              sudo curl -fsSL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64" \
                -o /usr/libexec/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/libexec/docker/cli-plugins/docker-compose
              docker compose version
            fi

            cd ~/deploy

            SYNC_ROOT=/tmp/afternote-deploy-sync
            if [ ! -f "${SYNC_ROOT}/nginx/nginx.conf" ]; then
              echo "[ERROR] synced nginx.conf not found at ${SYNC_ROOT}/nginx/nginx.conf"
              ls -laR "${SYNC_ROOT}" || true
              exit 1
            fi
            if [ ! -f "${SYNC_ROOT}/docker-compose.yml" ]; then
              echo "[ERROR] synced docker-compose.yml not found"
              exit 1
            fi

            mkdir -p ~/deploy/nginx ~/deploy/scripts
            TS=$(date +%Y%m%d%H%M%S)
            if [ -f nginx/nginx.conf ]; then
              cp nginx/nginx.conf "nginx/nginx.conf.bak.${TS}"
            fi
            if [ -f docker-compose.yml ]; then
              cp docker-compose.yml "docker-compose.yml.bak.${TS}"
            fi
            if [ -f .env ]; then
              cp .env ".env.bak.${TS}"
            fi

            cp "${SYNC_ROOT}/nginx/nginx.conf" nginx/nginx.conf
            cp "${SYNC_ROOT}/docker-compose.yml" docker-compose.yml
            if [ -f "${SYNC_ROOT}/scripts/bootstrap-certs.sh" ]; then
              cp "${SYNC_ROOT}/scripts/bootstrap-certs.sh" scripts/bootstrap-certs.sh
              chmod +x scripts/bootstrap-certs.sh
            fi
            if [ -f "${SYNC_ROOT}/production.env" ]; then
              cp "${SYNC_ROOT}/production.env" .env
              echo "[INFO] updated ~/deploy/.env from DEPLOY_PRODUCTION_ENV"
            else
              echo "[INFO] no production.env in sync bundle; left ~/deploy/.env unchanged"
            fi

            # Ensure TLS dirs + temporary self-signed if missing (greenfield)
            export DEPLOY_ROOT="$HOME/deploy"
            export TLS_DOMAIN="${TLS_DOMAIN:-afternote.kro.kr}"
            export CERTBOT_EMAIL="${CERTBOT_EMAIL:-}"
            if [ -x scripts/bootstrap-certs.sh ]; then
              ./scripts/bootstrap-certs.sh
            else
              mkdir -p data/certbot/conf data/certbot/www
            fi

            docker compose pull
            docker compose up -d --remove-orphans --pull always

            # Issue LE only when missing. Do NOT wipe an existing lineage every deploy.
            # Certbot container writes as root — chown afterwards so next bootstrap can see files.
            if [ -n "${CERTBOT_EMAIL:-}" ]; then
              DOMAIN="${TLS_DOMAIN:-afternote.kro.kr}"
              LIVE="data/certbot/conf/live/${DOMAIN}"
              if sudo test -f "${LIVE}/fullchain.pem" \
                && sudo openssl x509 -in "${LIVE}/fullchain.pem" -noout -issuer 2>/dev/null \
                  | grep -qi "Let's Encrypt"; then
                echo "[INFO] Let's Encrypt cert already present; skip issuance"
                sudo chown -R "$(id -u)":"$(id -g)" data/certbot/conf data/certbot/www 2>/dev/null || true
              else
                echo "[INFO] requesting Let's Encrypt cert (standalone)..."
                cd ~/deploy
                docker compose stop nginx || true
                # Remove non-LE / broken live dir only
                sudo rm -rf "data/certbot/conf/live/${DOMAIN}" \
                       "data/certbot/conf/archive/${DOMAIN}" \
                       "data/certbot/conf/renewal/${DOMAIN}.conf" || true
                if docker compose --profile cert run --rm --entrypoint certbot certbot certonly \
                  --standalone \
                  --preferred-challenges http \
                  --email "${CERTBOT_EMAIL}" \
                  --agree-tos \
                  --no-eff-email \
                  --non-interactive \
                  -d "${DOMAIN}"; then
                  echo "[INFO] Let's Encrypt certificate ready"
                else
                  echo "[WARN] certbot failed; restoring temporary self-signed so nginx can start"
                  sudo mkdir -p "data/certbot/conf/live/${DOMAIN}"
                  sudo openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
                    -keyout "data/certbot/conf/live/${DOMAIN}/privkey.pem" \
                    -out "data/certbot/conf/live/${DOMAIN}/fullchain.pem" \
                    -subj "/CN=${DOMAIN}" 2>/dev/null || true
                  sudo cp "data/certbot/conf/live/${DOMAIN}/fullchain.pem" "data/certbot/conf/live/${DOMAIN}/cert.pem" 2>/dev/null || true
                  sudo cp "data/certbot/conf/live/${DOMAIN}/fullchain.pem" "data/certbot/conf/live/${DOMAIN}/chain.pem" 2>/dev/null || true
                fi
                sudo chown -R "$(id -u)":"$(id -g)" data/certbot/conf data/certbot/www 2>/dev/null || true
                docker compose up -d nginx
                docker compose exec -T nginx nginx -s reload || true
              fi
            fi

            echo "[INFO] validating nginx config..."
            if ! docker compose exec -T nginx nginx -t; then
              echo "[ERROR] nginx -t failed; restoring previous nginx.conf if backup exists"
              if [ -f "nginx/nginx.conf.bak.${TS}" ]; then
                cp "nginx/nginx.conf.bak.${TS}" nginx/nginx.conf
                docker compose up -d nginx
                docker compose exec -T nginx nginx -t
                docker compose exec -T nginx nginx -s reload || true
              fi
              exit 1
            fi

            docker compose exec -T nginx nginx -s reload
            docker compose logs --tail=30 afternote-server
            docker image prune -f

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: [deploy]
    # deploy 성공, 또는 수동 실행에서 deploy만 스킵한 경우(현재 호스트 검증)
    if: >-
      always()
      && (
        needs.deploy.result == 'success'
        || (
          needs.deploy.result == 'skipped'
          && github.event_name == 'workflow_dispatch'
          && inputs.skip_deploy == true
        )
      )
    steps:
      - name: Smoke test
        env:
          BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo "[ERROR] APP_BASE_URL secret is not set"
            exit 1
          fi
          BASE_URL="${BASE_URL%/}"

          echo "Waiting for server ready at ${BASE_URL} ..."
          ready=0
          for i in $(seq 1 30); do
            if curl -sf "${BASE_URL}/v3/api-docs" | grep -q openapi; then
              ready=1
              break
            fi
            echo "retry ${i}/30 ..."
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "[ERROR] Smoke failed: /v3/api-docs not ready"
            exit 1
          fi

          echo "Checking /v3/api-docs ..."
          curl -sf "${BASE_URL}/v3/api-docs" | grep -q openapi

          echo "Checking /api/v1/app/version ..."
          curl -sf "${BASE_URL}/api/v1/app/version?platform=ANDROID&versionCode=10001" | grep -q '"status":200'

          echo "Checking /nginx-health ..."
          curl -sf "${BASE_URL}/nginx-health" | grep -q ok

          echo "Checking /actuator/health ..."
          curl -sf "${BASE_URL}/actuator/health" | grep -q '"status":"UP"'

          echo "Smoke OK"

  contract:
    name: Contract test
    runs-on: ubuntu-latest
    needs: [smoke]
    if: ${{ always() && needs.smoke.result == 'success' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Contract test
        env:
          BASE_URL: ${{ secrets.APP_BASE_URL }}
          CONTRACT_TEST_EMAIL: ${{ secrets.CONTRACT_TEST_EMAIL }}
          CONTRACT_TEST_PASSWORD: ${{ secrets.CONTRACT_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x scripts/contract-test.sh
          ./scripts/contract-test.sh
