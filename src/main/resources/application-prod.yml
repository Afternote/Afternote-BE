spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        show_sql: false
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

logging:
  level:
    com.example.afternote: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

# Error monitoring only (no tracing/replay). Set SENTRY_DSN in deploy env.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:prod}
  send-default-pii: false
  traces-sample-rate: 0.0
  exception-resolver-order: 2147483647

management:
  server:
    port: 8081
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,redis
  endpoints:
    web:
      exposure:
        include: health,prometheus
  health:
    mail:
      enabled: false
